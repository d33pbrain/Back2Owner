<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Review | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="app-body">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <div class="mx-auto flex min-h-screen w-full max-w-[1280px]">
    <div id="sidebar-container"></div>

    <main class="min-w-0 flex-1 px-4 py-6 sm:px-6 lg:px-8">
      <header class="mb-6 flex items-center gap-3">
        <button id="menuToggle" class="icon-btn lg:hidden" aria-label="Open menu">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>

        <a href="back2owner my reports page.html" class="icon-btn" aria-label="Back to My Reports">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>

        <nav class="crumb" aria-label="Breadcrumb">
          <a href="back2owner my reports page.html" class="crumb-link">My Reports</a>
          <span class="crumb-sep">/</span>
          <span class="crumb-current">Claim Review</span>
        </nav>
      </header>

      <section id="itemPanel" aria-label="Reported item"></section>

      <div class="all-claims-bar mt-6">ALL CLAIMS</div>

      <section id="claimsList" class="mt-5 flex flex-col gap-5" aria-live="polite"></section>
    </main>
  </div>

  <script src="js/home.js"></script>
  <script src="js/claims.js"></script>
</body>
</html>
