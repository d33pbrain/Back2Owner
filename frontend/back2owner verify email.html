<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Email | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-canvas font-sans antialiased"> 
  <main class="relative isolate mx-auto flex min-h-screen w-full max-w-[1280px] items-center justify-center overflow-hidden bg-canvas px-4 py-8 sm:px-6 xl:px-12 xl:py-12">

    <!-- Background Layer -->
    <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="absolute inset-x-0 bottom-0 -z-20 h-[320px] rounded-t-[40px] bg-brand xl:hidden"></div>
      <img src="images/Rectangle 2.svg" alt="" class="absolute hidden max-w-none xl:block xl:-right-10 xl:-top-10 xl:h-[105%] xl:w-auto">
      <img src="images/girl2.png" alt="" class="absolute bottom-0 left-1/2 h-[260px] w-auto max-w-none -translate-x-[65%] sm:h-[320px] xl:bottom-0 xl:right-0 xl:left-auto xl:max-h-[850px] xl:w-auto xl:translate-x-0">
    </div>

    <!-- Main Grid Container -->
    <div class="grid w-full grid-cols-1 items-center gap-8 xl:grid-cols-2 xl:gap-12">

      <section class="z-10 mx-auto flex w-full max-w-[540px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 shadow-xl border border-slate-100/80 sm:px-10 sm:py-10">

        <!-- Logo Header Lockup -->
        <div class="flex items-center gap-1.5">
          <svg class="h-5 w-5 text-[#151C25]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span class="text-[13px] font-black uppercase tracking-[0.08em] text-[#151C25]">
            BACK<span class="text-[#FF6B00]">2</span>OWNER
          </span>
        </div>

        <div class="flex w-full flex-col gap-2">
          <h1 class="text-[26px] font-extrabold leading-tight text-[#151C25] sm:text-[32px]">
            Verify Your Email Address
          </h1>

          <p class="text-[14px] leading-[22px] text-[#45464C] sm:text-[15px] sm:leading-[23px]">
            A 6-digit confirmation code has been sent to <span id="target-email" class="font-bold text-[#151C25]">your email</span>. Kindly check your inbox or spam folder.
          </p>
        </div>

        <!-- Global Status Alert Box -->
        <div id="status-alert" class="hidden rounded-xl border p-3 text-[13px] font-medium"></div>

        <form id="verify-form" class="flex w-full flex-col gap-6">

          <div class="flex w-full flex-col gap-2">
            <label class="text-[11px] font-bold uppercase tracking-[0.1em] text-[#0D1B2E]">
              Enter the confirmation code
            </label>

            <!-- Responsive 6-Digit Code Row -->
            <div id="code-row" class="flex h-[44px] w-full justify-between gap-1.5 sm:gap-2">
              <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"
                     class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white px-2 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 transition" />
            </div>
          </div>

          <div class="flex w-full flex-col pt-1">
            <button id="submit-btn" type="submit"
                    class="flex h-[56px] sm:h-[60px] w-full items-center justify-center gap-2 rounded-[18px] bg-accent px-4 py-3 transition-colors hover:bg-accent-dark focus:outline-none focus:ring-2 focus:ring-accent/40 disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="submit-text" class="text-center text-[16px] font-semibold leading-6 tracking-normal text-white">Confirm</span>
              <svg id="submit-spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <div class="flex w-full flex-wrap items-center justify-center gap-1.5 pt-1 text-xs sm:text-sm">
          <span class="text-center font-medium text-[#45464C]">Didn't Receive An Email?</span>
          <button type="button" id="resend-btn"
                  class="text-center font-semibold text-[#151C25] hover:text-brand disabled:opacity-50 transition">Request New Code</button>
        </div>

      </section>

      <!-- Desktop Alignment Space -->
      <div class="hidden xl:block min-h-[600px] w-full"></div>

    </div>
  </main>
  <script src="config.js"></script>
  <script src="js/verify_email.js"></script>
</body>
</html>
