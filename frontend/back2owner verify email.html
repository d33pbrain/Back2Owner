<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Email | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-canvas"> 
  <main class="relative isolate mx-auto w-full max-w-[1280px] overflow-hidden bg-canvas xl:h-[870px]">

    <div class="absolute inset-x-0 bottom-0 -z-20 h-[420px] rounded-t-[40px] bg-brand xl:hidden"></div>
    <img src="images/Rectangle 2.svg" alt="" class="absolute -z-20 hidden h-[865px] w-[1387px] max-w-none left-[-53px] top-[101px] xl:block">
    <img src="images/girl2.png" alt="" class="absolute -z-10 max-w-none bottom-0 left-1/2 h-[300px] w-auto -translate-x-[70%] xl:bottom-auto xl:left-[-24px] xl:top-[-40px] xl:h-[928px] xl:w-[1662px] xl:translate-x-0">

    <div class="flex min-h-screen w-full items-start justify-center px-4 pt-8 pb-[400px] xl:min-h-0 xl:h-[870px] xl:items-center xl:justify-between xl:pt-10 xl:pr-8 xl:pb-10 xl:pl-[52px]">

      <section class="flex h-fit w-full max-w-[576px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 sm:px-12 sm:py-10">

        <div class="flex w-full flex-col gap-3">
          <div class="flex items-center gap-1.5">
            <span class="h-2 w-2 bg-black"></span>
            <span class="text-[11px] font-bold leading-none tracking-[0.1em] text-[#45464C]">BACK2OWNER</span>
          </div>

          <h1 class="flex min-h-[40px] items-center text-[26px] font-extrabold leading-none tracking-normal text-[#151C25] sm:text-[32px]">
            Verify Your Email Address
          </h1>

          <p class="text-[15px] font-normal leading-[23px] tracking-normal text-[#45464C]">
            A 6-digit confirmation code has been sent to your email, kindly check your mail.
          </p>
        </div>

        <form id="verify-form" class="flex w-full flex-col gap-6">

          <div class="flex w-full flex-col gap-2">
            <label class="text-[11px] font-bold leading-none tracking-[0.1em] text-[#0D1B2E]">
              Enter the confirmation code
            </label>

            <div id="code-row" class="flex h-[43px] w-full justify-between gap-2 sm:gap-4 xl:gap-0">
              <input type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Digit 1"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"
                     class="code-box h-[43px] min-w-0 flex-1 rounded-lg border border-[#D6DEEA] bg-white px-3 text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 xl:w-[60px] xl:flex-none" />
            </div>
          </div>

          <div class="flex w-full flex-col pt-1">
            <button type="submit"
                    class="flex h-[60px] w-full items-center justify-center gap-1 rounded-[18px] bg-accent px-4 py-3 transition-colors hover:bg-accent-dark focus:outline-none focus:ring-2 focus:ring-accent/40">
              <span class="text-center text-[16px] font-semibold leading-6 tracking-normal text-white">Confirm</span>
            </button>
          </div>
        </form>

        <div class="flex w-full flex-wrap items-center justify-center gap-1 pt-1">
          <span class="text-center text-[14px] font-medium leading-5 tracking-normal text-[#45464C]">Didn't Receive An Email?</span>
          <button type="button" id="resend"
                  class="text-center text-[15px] font-semibold leading-[22px] tracking-normal text-[#151C25] hover:text-brand">Request</button>
        </div>

      </section>
    </div>
  </main>

  <script>
    const boxes = document.querySelectorAll(".code-box");

    boxes.forEach(function (box, i) {
      box.addEventListener("input", function () {
        const digits = box.value.replace(/\D/g, "");
        
        if (digits.length > 1) {
            digits.slice(0, boxes.length - i).split("").forEach(function (d, k) {
                boxes[i + k].value = d;
            });
            boxes[Math.min(i + digits.length, boxes.length - 1)].focus();
            return;
        }

        box.value = digits;
        if (digits && i < boxes.length - 1) boxes[i + 1].focus();
    });
      box.addEventListener("paste", function (e) {
        e.preventDefault();
        const digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, boxes.length);
        digits.split("").forEach(function (d, k) { boxes[k].value = d; });
        boxes[Math.min(digits.length, boxes.length - 1)].focus();
      });
    });

    document.getElementById("verify-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const code = Array.from(boxes).map(function (b) { return b.value; }).join("");
      if (code.length < boxes.length) { alert("Please enter all 6 digits."); return; }
      window.location.href = "back2owner home page.html";
    });

    document.getElementById("resend").addEventListener("click", function () {
      console.log("Resend requested");
    });
  </script>
</body>
</html>
