<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Back2Owner</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#2057E0", tint: "#E2ECFF", dark: "#0B1F4D" },
            accent: { DEFAULT: "#F97316", dark: "#EA580C" },
            canvas: "#EEF2F8",
          },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] },
        },
      },
    };
  </script>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" >
  <style>
  /* Hide the browser's own show-password button; we use our own eye icon */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear {
    display: none;
  }
  </style>
</head>

<body class="font-sans text-slate-900 bg-canvas">

  <!-- Main: vertical, fill 1280, fixed height 870, bg color/canvas #EEF2F8 -->
  <main class="relative isolate mx-auto w-full max-w-[1280px] overflow-hidden bg-canvas xl:h-[870px]">

    <!-- Background illustration (girl on the bench + blue shape). Export from Figma as PNG at 2x -> images/signup-bg.png -->
    <!-- Rectangle 2 (exported): 1387 x 865, top 101, left -53 — sits behind the illustration -->
    <!-- PHONE ONLY: blue panel at the bottom (plain colour, rounded top corners) -->
    <div class="absolute inset-x-0 bottom-0 -z-20 h-[420px] rounded-t-[40px] bg-[#2057E0] xl:hidden"></div>
      <!-- DESKTOP ONLY: Rectangle 2 (exported) -->
      <img src="images/Rectangle 2.svg" alt="" class="absolute -z-20 hidden h-[865px] w-[1387px] max-w-none left-[-53px] top-[101px] xl:block">
      <!-- Illustration: small and bottom-centred on phones, exact Figma position from xl up -->
      <img src="images/girl2.png" alt="" class="absolute -z-10 max-w-none bottom-0 left-1/2 h-[300px] w-auto -translate-x-[70%] xl:bottom-auto xl:left-[-24px] xl:top-[-40px] xl:h-[928px] xl:w-[1662px] xl:translate-x-0">
    <!-- Container: horizontal, 1280 x 870, justify space-between, padding top 40 / right 32 / bottom 40 / left 52 -->
    <div class="flex min-h-screen w-full justify-center px-4 pt-8 pb-[300px] xl:min-h-0 xl:h-[870px] xl:justify-between xl:pt-10 xl:pr-8 xl:pb-10 xl:pl-[52px]">

      <!-- Card Container: vertical, fixed 576 (max 576), hug height (792), radius 30,
           padding 40 / 48 / 40 / 48, gap 24, bg color/surface #FFFFFF -->
      <section class="flex h-fit w-full max-w-[576px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 sm:px-12 sm:py-10">

        <!-- Heading & Supporting Subtext: vertical, fill (480), hug height (147), gap 12 -->
        <div class="flex w-full flex-col gap-3">

          <!-- Container: horizontal, fill (480), hug height (14), gap 4 -->
          <div class="flex w-full items-center gap-1">
            <!-- Background (the small square icon): 8 x 8, #000000 -->
            <span class="block h-2 w-2 bg-black"></span>
            <!-- Container: vertical, hug 91 x 14 -->
            <div class="flex flex-col">
              <!-- BACK2OWNER: Plus Jakarta Sans, Bold 700, 11px, line height 100%, letter spacing 10%, #45464C -->
              <span class="text-[11px] font-bold uppercase leading-none tracking-[0.1em] text-[#45464C]">BACK2OWNER</span>
            </div>
          </div>

          <!-- Heading 1: vertical, fill (480), hug height (40) -->
          <div class="flex w-full flex-col">
            <!-- Create Your Account: ExtraBold 800, 32px, line height 100%, letter spacing 0%, #151C25 -->
            <h1 class="flex h-[40px] items-center text-[32px] font-extrabold leading-none tracking-normal text-[#151C25]">Create Your Account</h1>
          </div>

          <!-- Container: vertical, fill (480), hug height (69) -->
          <div class="flex w-full flex-col">
            <!-- Body: Regular 400, 15px, line height 23px, letter spacing 0%, #45464C -->
            <p class="text-[15px] font-normal leading-[23px] tracking-normal text-[#45464C]">
              Join the Back2Owner campus network to report lost or found items, submit ownership claims, and communicate safely across Great Ife campus.
            </p>
          </div>
        </div>
        <form id="signup-form" class="flex w-full flex-col gap-6">
          <div class="flex w-full flex-col gap-1">
            <div class="flex w-full flex-col">
              <label for="full-name" class="text-[16px] font-semibold leading-[25px] tracking-normal text-[#151C25]">Full Name <span class="text-red-500">*</span></label>
            </div>
            <input
            id="full-name"
            name="full-name"
            type="text"
            required
            autocomplete="name"
            placeholder="e.g., Babatunde Adeleke"
            class="h-[43px] w-full rounded-lg border border-[#D6DEEA] bg-white px-3 text-[14px] font-normal leading-5 text-[#151C25] placeholder:text-[#7B8798] focus:border-[#2057E0] focus:outline-none focus:ring-2 focus:ring-[#2057E0]/20"/>
          </div>
          <!--Email-->
          <div class="flex w-full flex-col gap-1">
            <div class="flex w-full flex-col">
              <label for="email" class="text-[16px] font-semibold leading-[25px] tracking-normal text-[#151C25]">Email Address <span class="text-red-500">*</span></label>
            </div>
            <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="e.g., student@student.oauife.edu.ng"
            class="h-[43px] w-full rounded-lg border border-[#D6DEEA] bg-white px-3 text-[14px] font-normal leading-5 text-[#151C25] placeholder:text-[#7B8798] focus:border-[#2057E0] focus:outline-none focus:ring-2 focus:ring-[#2057E0]/20"/>
             <!-- Hint: icon + text (sizes and colors estimated) -->
            <p class="flex h-5 items-center gap-1.5 text-[11px] font-bold leading-none text-[#45464C]">
            <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>Must be a valid email address</p>
          </div>
          <!-- Department or Faculty Field -->
          <div class="flex w-full flex-col gap-1">
            <div class="flex w-full flex-col">
              <label for="department" class="text-[16px] font-semibold leading-[25px] tracking-normal text-[#151C25]">Department or Faculty <span class="text-red-500">*</span></label>
            </div>
            <input
            id="department"
            name="department"
            type="text"
            required
            placeholder="e.g., Computer Science &amp; Engineering / Faculty of Technology"
            class="h-[43px] w-full rounded-lg border border-[#D6DEEA] bg-white px-3 text-[14px] font-normal leading-5 text-[#151C25] placeholder:text-[#7B8798] focus:border-[#2057E0] focus:outline-none focus:ring-2 focus:ring-[#2057E0]/20"/>
          </div>
          <!-- Password Field: same as the others, with a show/hide eye button inside the input and a hint line -->
          <div class="flex w-full flex-col gap-1">
            <div class="flex w-full flex-col">
              <label for="password" class="text-[16px] font-semibold leading-[25px] tracking-normal text-[#151C25]">Password <span class="text-red-500">*</span></label>
            </div>
            <div class="relative w-full">
            <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="••••••••••••"
            class="h-[43px] w-full rounded-lg border border-[#D6DEEA] bg-white pl-3 pr-11 text-[14px] font-normal leading-5 text-[#151C25] placeholder:text-[#7B8798] focus:border-[#2057E0] focus:outline-none focus:ring-2 focus:ring-[#2057E0]/20"/>
            <!-- Eye button: click to show or hide the password -->
            <button id="toggle-password" type="button" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#45464C] hover:text-[#151C25]">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            </div>
            <p class="flex h-5 items-center gap-1.5 text-[11px] font-bold leading-none text-[#45464C]">
              <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Minimum 8 characters</p>
          </div>
          <!-- Primary Action Button: vertical, fill (480px), hug (64px), padding-top 4px -->
          <div class="flex w-full flex-col pt-1">
            <!-- Button: horizontal, fill, fixed 60px, radius 18px, padding 12/16, gap 4px, color/amber #F97316 -->
            <button type="submit" class="flex h-[60px] w-full items-center justify-center gap-1 rounded-[18px] bg-[#F97316] px-4 py-3 transition-colors hover:bg-[#EA580C] focus:outline-none focus:ring-2 focus:ring-[#F97316]/40">
              <!-- Container + Text: Plus Jakarta Sans 600, 16px / 24px, 0% spacing, centered, #FFFFFF -->
              <span class="text-center text-[16px] font-semibold leading-6 tracking-normal text-white">Create Account</span>
            </button>
          </div>
        </form>
        <!-- Sign In Redirection Link: horizontal, fill (480px), hug (26px), padding-top 4px, gap 4px -->
        <div class="flex w-full items-center justify-center gap-1 pt-1">
          <!-- Text: "Already have an account?" — Input/Label: 500, 14px / 20px, #45464C, center -->
          <span class="text-center text-[14px] font-medium leading-5 tracking-normal text-[#45464C]">Already have an account?</span>
            <!-- Text: "Sign in." — Link: 600, 15px / 22px, #151C25, center -->
            <a href="signin.html" class="text-center text-[15px] font-semibold leading-[22px] tracking-normal text-[#151C25] hover:text-[#2057E0]">Sign in.</a>
        </div>
      </section>
    </div>
  </main>
  <script>
  const pw = document.getElementById("password");
  const eye = document.getElementById("toggle-password");
  eye.addEventListener("click", function () {
    const showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    eye.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });
  document.getElementById("signup-form").addEventListener("submit", function (e) {
  e.preventDefault(); // remove later when you connect a real backend
  });
  </script>
</body>
</html>
