<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-[#F8F9FF]">
  <main class="relative isolate mx-auto w-full max-w-[1280px] overflow-hidden bg-[#F8F9FF] xl:h-[870px]">

    <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
      <div class="absolute inset-x-0 bottom-0 h-[300px] rounded-t-[30px] bg-brand xl:hidden"></div>
      <img src="images/girl3.png" alt=""
           class="absolute bottom-0 left-1/2 h-[300px] w-auto max-w-none -translate-x-[70%] xl:hidden" />

      <img src="images/Rectangle 2.svg" alt=""
           class="absolute hidden max-w-none xl:block xl:left-[-53px] xl:top-[101px] xl:h-[865px] xl:w-[1387px]" />
      <img src="images/girl3.png" alt=""
           class="absolute hidden max-w-none xl:block xl:left-[-26px] xl:top-[-85px] xl:h-[1004px] xl:w-[1799px]" />
    </div>

    <div class="flex min-h-screen w-full items-start justify-center px-4 pb-[400px] pt-8
                xl:h-[870px] xl:min-h-0 xl:items-center xl:justify-between xl:pb-10 xl:pl-[52px] xl:pr-8 xl:pt-10">

      <div class="flex h-fit w-full max-w-[576px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 sm:px-12 sm:py-10">

        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-[2px] bg-[#151C25]"></span>
          <span class="text-[11px] font-bold uppercase tracking-[0.1em] text-[#151C25]">Back2Owner</span>
        </div>

        <div class="flex flex-col gap-2">
          <h1 class="text-[26px] font-extrabold leading-tight text-[#151C25] sm:text-[32px]">Forgot Password?</h1>
          <p class="text-[15px] leading-[23px] text-[#45464C]">Enter your new password</p>
        </div>

        <form id="reset-form" class="flex w-full flex-col gap-5">

          <div class="flex flex-col gap-2">
            <label for="password" class="text-[14px] font-medium leading-5 text-[#151C25]">
              Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="password" type="password" required autocomplete="new-password"
                     placeholder="•••••••••••••"
                     class="h-11 w-full rounded-lg border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium leading-5 text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand" />
              <button type="button" data-toggle="password" aria-label="Show password"
                      class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <label for="confirm-password" class="text-[14px] font-medium leading-5 text-[#151C25]">
              Confirm Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="confirm-password" type="password" required autocomplete="new-password"
                     placeholder="•••••••••••••"
                     class="h-11 w-full rounded-lg border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium leading-5 text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand" />
              <button type="button" data-toggle="confirm-password" aria-label="Show password"class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <p id="form-error" class="hidden text-[12px] font-medium leading-4 text-[#E5484D]" role="alert"></p>

          <div class="flex w-full flex-col pt-1">
            <button type="submit"
                    class="flex h-[60px] w-full items-center justify-center rounded-[18px] bg-accent px-4 py-3 text-[16px] font-semibold leading-6 text-white transition-colors hover:bg-accent-dark">
              Login
            </button>
          </div>

          <div class="flex w-full items-center justify-center gap-1 pt-1">
            <span class="text-[14px] font-medium text-[#45464C]">New User?</span>
            <a href="back2owner sign up page.html" class="text-[15px] font-semibold text-[#151C25] hover:underline">Sign Up.</a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("reset-form");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm-password");
    const errorMsg = document.getElementById("form-error");

    document.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const field = document.getElementById(btn.dataset.toggle);
        field.type = field.type === "password" ? "text" : "password";
      });
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      if (password.value.length < 8) {
        errorMsg.textContent = "Password must be at least 8 characters.";
        errorMsg.classList.remove("hidden");
        password.focus();
        return;
      }

      if (password.value !== confirmPassword.value) {
        errorMsg.textContent = "Passwords do not match.";
        errorMsg.classList.remove("hidden");
        confirmPassword.focus();
        return;
      }

      errorMsg.classList.add("hidden");
      window.location.href = "back2owner sign in page.html";
    });

    [password, confirmPassword].forEach((input) =>
      input.addEventListener("input", () => errorMsg.classList.add("hidden"))
    );
  </script>
</body>
</html>
