<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-[#F8F9FF] font-sans antialiased">
  <main class="relative isolate mx-auto flex min-h-screen w-full max-w-[1280px] items-center justify-center overflow-hidden bg-[#F8F9FF] px-4 py-8 sm:px-6 xl:px-12 xl:py-12">

    <!-- Background Layer -->
    <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div class="absolute inset-x-0 bottom-0 -z-20 h-[320px] rounded-t-[40px] bg-brand xl:hidden"></div>
      <img src="images/girl3.png" alt="" class="absolute bottom-0 left-1/2 h-[260px] w-auto max-w-none -translate-x-[65%] sm:h-[320px] xl:hidden" />
      <img src="images/Rectangle 2.svg" alt="" class="absolute hidden max-w-none xl:block xl:-right-10 xl:-top-10 xl:h-[105%] xl:w-auto" />
      <img src="images/girl3.png" alt="" class="absolute hidden max-w-none xl:block xl:right-0 xl:bottom-0 xl:max-h-[850px] xl:w-auto" />
    </div>

    <!-- Main Grid Container -->
    <div class="grid w-full grid-cols-1 items-center gap-8 xl:grid-cols-2 xl:gap-12">

      <div class="z-10 mx-auto flex w-full max-w-[540px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 shadow-xl border border-slate-100/80 sm:px-10 sm:py-10">

        <!-- Logo Header Lockup -->
        <div class="flex items-center gap-1.5">
          <svg class="h-5 w-5 text-[#151C25]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span class="text-[13px] font-black uppercase tracking-[0.08em] text-[#151C25]">
            BACK<span class="text-[#FF6B00]">2</span>OWNER
          </span>
        </div>

        <div class="flex flex-col gap-2">
          <h1 id="page-title" class="text-[26px] font-extrabold leading-tight text-[#151C25] sm:text-[32px]">Forgot Password?</h1>
          <p id="page-subtitle" class="text-[14px] leading-[22px] text-[#45464C] sm:text-[15px] sm:leading-[23px]">Enter your registered email address to receive a 6-digit password reset code.</p>
        </div>

        <!-- Global Status Alert Box -->
        <div id="status-alert" class="hidden rounded-xl border p-3 text-[13px] font-medium"></div>

        <!-- STEP 1: REQUEST OTP FORM -->
        <form id="request-otp-form" class="flex w-full flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-[14px] sm:text-[15px] font-semibold text-[#151C25]">
              Email Address <span class="text-[#E5484D]">*</span>
            </label>
            <input id="email" type="email" required autocomplete="email" placeholder="e.g., student@student.oauife.edu.ng"
                   class="h-12 w-full rounded-xl border border-[#D6DEEA] bg-white p-3 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand focus:ring-2 focus:ring-brand/20 transition" />
          </div>

          <div class="flex w-full flex-col pt-1">
            <button id="request-btn" type="submit"
                    class="flex h-[56px] sm:h-[60px] w-full items-center justify-center gap-2 rounded-[18px] bg-accent px-4 py-3 text-[16px] font-semibold text-white transition-colors hover:bg-accent-dark disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="request-text">Send Reset Code</span>
              <svg id="request-spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <!-- STEP 2: RESET PASSWORD FORM (Hidden by default) -->
        <form id="reset-password-form" class="hidden flex w-full flex-col gap-5">

          <!-- 6-Digit OTP Input Row -->
          <div class="flex flex-col gap-2">
            <label class="text-[11px] font-bold uppercase tracking-[0.1em] text-[#0D1B2E]">
              Enter 6-Digit Confirmation Code <span class="text-[#E5484D]">*</span>
            </label>
            <div id="code-row" class="flex h-[44px] w-full justify-between gap-1.5 sm:gap-2">
              <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" class="code-box h-[44px] min-w-0 flex-1 rounded-xl border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20" />
            </div>
          </div>

          <!-- New Password -->
          <div class="flex flex-col gap-2">
            <label for="password" class="text-[14px] sm:text-[15px] font-semibold text-[#151C25]">
              New Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••••••"
                     class="h-12 w-full rounded-xl border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand focus:ring-2 focus:ring-brand/20 transition" />
              <button type="button" id="toggle-password" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="flex flex-col gap-2">
            <label for="confirm-password" class="text-[14px] sm:text-[15px] font-semibold text-[#151C25]">
              Confirm Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••••••"
                     class="h-12 w-full rounded-xl border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand focus:ring-2 focus:ring-brand/20 transition" />
              <button type="button" id="toggle-confirm-password" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="flex w-full flex-col pt-1">
            <button id="reset-btn" type="submit"
                    class="flex h-[56px] sm:h-[60px] w-full items-center justify-center gap-2 rounded-[18px] bg-accent px-4 py-3 text-[16px] font-semibold text-white transition-colors hover:bg-accent-dark disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="reset-text">Update Password</span>
              <svg id="reset-spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <div class="flex w-full items-center justify-center gap-1.5 pt-1 text-xs sm:text-sm">
          <span class="font-medium text-[#45464C]">Remembered Password?</span>
          <a href="back2owner sign in page.html" class="font-semibold text-[#151C25] hover:underline">Sign In.</a>
        </div>

      </div>

      <!-- Desktop Alignment Space -->
      <div class="hidden xl:block min-h-[600px] w-full"></div>

    </div>
  </main>
  <script src="config.js"></script>
  <script src="js/forgot_password.js"></script>
</body>
</html>
