<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Back2Owner</title>
  <link rel="stylesheet" href="output.css" />
</head>

<body class="bg-[#F8F9FF]">
  <main class="relative isolate mx-auto w-full max-w-[1280px] overflow-hidden bg-[#F8F9FF] xl:h-[870px]">

    <div class="pointer-events-none absolute inset-0 -z-10" aria-hidden="true">
      <div class="absolute inset-x-0 bottom-0 h-[300px] rounded-t-[30px] bg-brand xl:hidden"></div>
      <img src="images/girl3.png" alt="" class="absolute bottom-0 left-1/2 h-[300px] w-auto max-w-none -translate-x-[70%] xl:hidden" />
      <img src="images/Rectangle 2.svg" alt="" class="absolute hidden max-w-none xl:block xl:left-[-53px] xl:top-[101px] xl:h-[865px] xl:w-[1387px]" />
      <img src="images/girl3.png" alt="" class="absolute hidden max-w-none xl:block xl:left-[-26px] xl:top-[-85px] xl:h-[1004px] xl:w-[1799px]" />
    </div>

    <div class="flex min-h-screen w-full items-start justify-center px-4 pb-[400px] pt-8 xl:h-[870px] xl:min-h-0 xl:items-center xl:justify-between xl:pb-10 xl:pl-[52px] xl:pr-8 xl:pt-10">

      <div class="flex h-fit w-full max-w-[576px] flex-col gap-6 rounded-[30px] bg-white px-6 py-8 sm:px-12 sm:py-10">

        <div class="flex items-center gap-2">
          <span class="h-2.5 w-2.5 rounded-[2px] bg-[#151C25]"></span>
          <span class="text-[11px] font-bold uppercase tracking-[0.1em] text-[#151C25]">Back2Owner</span>
        </div>

        <div class="flex flex-col gap-2">
          <h1 id="page-title" class="text-[26px] font-extrabold leading-tight text-[#151C25] sm:text-[32px]">Reset Password</h1>
          <p id="page-subtitle" class="text-[15px] leading-[23px] text-[#45464C]">Enter your registered email address to receive a 6-digit password reset code.</p>
        </div>

        <!-- Global Status Alert Box -->
        <div id="status-alert" class="hidden rounded-xl border p-3 text-[13px] font-medium"></div>

        <!-- STEP 1: REQUEST OTP FORM -->
        <form id="request-otp-form" class="flex w-full flex-col gap-5">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-[14px] font-medium leading-5 text-[#151C25]">
              Email Address <span class="text-[#E5484D]">*</span>
            </label>
            <input id="email" type="email" required autocomplete="email" placeholder="e.g., student@student.oauife.edu.ng"
                   class="h-11 w-full rounded-lg border border-[#D6DEEA] bg-white p-3 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand" />
          </div>

          <div class="flex w-full flex-col pt-1">
            <button id="request-btn" type="submit"
                    class="flex h-[60px] w-full items-center justify-center gap-2 rounded-[18px] bg-accent px-4 py-3 text-[16px] font-semibold text-white transition-colors hover:bg-accent-dark disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="request-text">Send Reset Code</span>
              <svg id="request-spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <!-- STEP 2: RESET PASSWORD FORM (Hidden by default) -->
        <form id="reset-password-form" class="hidden flex w-full flex-col gap-5">

          <!-- 6-Digit OTP Input Row -->
          <div class="flex flex-col gap-2">
            <label class="text-[11px] font-bold uppercase tracking-[0.1em] text-[#0D1B2E]">
              Enter 6-Digit Confirmation Code <span class="text-[#E5484D]">*</span>
            </label>
            <div id="code-row" class="flex h-[43px] w-full justify-between gap-2 sm:gap-4">
              <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
              <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" class="code-box h-[43px] w-[50px] flex-1 rounded-lg border border-[#D6DEEA] bg-white text-center text-[18px] font-bold text-[#151C25] focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/20 sm:w-[60px] sm:flex-none" />
            </div>
          </div>

          <!-- New Password -->
          <div class="flex flex-col gap-2">
            <label for="password" class="text-[14px] font-medium leading-5 text-[#151C25]">
              New Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="•••••••••••••"
                     class="h-11 w-full rounded-lg border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand" />
              <button type="button" id="toggle-password" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="flex flex-col gap-2">
            <label for="confirm-password" class="text-[14px] font-medium leading-5 text-[#151C25]">
              Confirm Password <span class="text-[#E5484D]">*</span>
            </label>
            <div class="relative">
              <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="•••••••••••••"
                     class="h-11 w-full rounded-lg border border-[#D6DEEA] bg-white p-3 pr-11 text-[14px] font-medium text-[#151C25] outline-none placeholder:text-[#76777D] focus:border-brand" />
              <button type="button" id="toggle-confirm-password" aria-label="Show password" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-[#45464C]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="flex w-full flex-col pt-1">
            <button id="reset-btn" type="submit"
                    class="flex h-[60px] w-full items-center justify-center gap-2 rounded-[18px] bg-accent px-4 py-3 text-[16px] font-semibold text-white transition-colors hover:bg-accent-dark disabled:opacity-60 disabled:cursor-not-allowed">
              <span id="reset-text">Update Password</span>
              <svg id="reset-spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </button>
          </div>
        </form>

        <div class="flex w-full items-center justify-center gap-1 pt-1">
          <span class="text-[14px] font-medium text-[#45464C]">Remembered Password?</span>
          <a href="back2owner sign in page.html" class="text-[15px] font-semibold text-[#151C25] hover:underline">Sign In.</a>
        </div>

      </div>
    </div>
  </main>

  <script src="js/forgot_password.js"></script>
</body>
</html>
